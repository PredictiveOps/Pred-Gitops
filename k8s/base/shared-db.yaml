apiVersion: v1
kind: Service
metadata:
  name: shared-db
  labels:
    app.kubernetes.io/name: shared-db
spec:
  type: ClusterIP
  selector:
    app: shared-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shared-db
  labels:
    app: shared-db
    app.kubernetes.io/name: shared-db
spec:
  serviceName: shared-db
  replicas: 1
  selector:
    matchLabels:
      app: shared-db
  template:
    metadata:
      labels:
        app: shared-db
        app.kubernetes.io/name: shared-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: predictive_maintenance
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: shared-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-secret
                  key: password
          volumeMounts:
            - name: shared-db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
  volumeClaimTemplates:
    - metadata:
        name: shared-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: gcp-balanced-rwo
        resources:
          requests:
            storage: 50Gi
