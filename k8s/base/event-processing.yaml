apiVersion: v1
kind: Service
metadata:
  name: event-processing
  labels:
    app.kubernetes.io/name: event-processing
spec:
  type: ClusterIP
  selector:
    app: event-processing
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-processing
  labels:
    app: event-processing
    app.kubernetes.io/name: event-processing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-processing
  template:
    metadata:
      labels:
        app: event-processing
        app.kubernetes.io/name: event-processing
    spec:
      containers:
        - name: event-processing
          image: predictive-maintenance-event-processing:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka-headless.predictive-maintenance.svc.cluster.local:9092
            - name: KAFKA_INPUT_TOPIC
              value: sensor-events
            - name: KAFKA_OUTPUT_TOPIC
              value: enriched-events
            - name: SHARED_DB_HOST
              value: shared-db
            - name: SHARED_DB_PORT
              value: "5432"
            - name: SHARED_DB_NAME
              value: predictive_maintenance
            - name: SHARED_DB_USER
              valueFrom:
                secretKeyRef:
                  name: shared-db-secret
                  key: username
            - name: SHARED_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shared-db-secret
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "300m"
              memory: "384Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
