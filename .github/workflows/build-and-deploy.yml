name: Build, Push, and Update K8s Tags

on:
  push:
    branches:
      - main
    paths-ignore:
      - "newfolder/k8s/overlays/prod/kustomization.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predictive-maintenance-main-deploy
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frontend
          - api-gateway
          - ingestion
          - event-processing
          - ml
          - notification
    env:
      DEFAULT_DOCR_REGISTRY: registry.digitalocean.com/predictive-maintenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DOCR_TOKEN }}" || (echo "DOCR_TOKEN is missing" && exit 1)

      - name: Set image variables
        run: |
          REGISTRY="${{ secrets.DOCR_REGISTRY }}"

          if [ -z "${REGISTRY}" ]; then
            REGISTRY="${DEFAULT_DOCR_REGISTRY}"
          fi

          REGISTRY="${REGISTRY//$'\r'/}"
          REGISTRY="${REGISTRY//$'\n'/}"

          REPOSITORY="predictive-maintenance-${{ matrix.service }}"

          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${REGISTRY}/${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: doctl
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-push
    env:
      KUSTOMIZATION_FILE: newfolder/k8s/overlays/prod/kustomization.yaml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag variable
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Update kustomization image tags
        run: |
          test -f "${KUSTOMIZATION_FILE}" || (echo "Kustomization file not found" && exit 1)

          TMP_FILE="$(mktemp)"

          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^([[:space:]]*newTag:[[:space:]]*).*$ ]]; then
              printf '%s%s\n' "${BASH_REMATCH[1]}" "${IMAGE_TAG}" >> "$TMP_FILE"
            else
              printf '%s\n' "$line" >> "$TMP_FILE"
            fi
          done < "${KUSTOMIZATION_FILE}"

          mv "$TMP_FILE" "${KUSTOMIZATION_FILE}"

      - name: Commit manifest update
        run: |
          if git diff --quiet -- "${KUSTOMIZATION_FILE}"; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${KUSTOMIZATION_FILE}"
          git commit -m "ci: set images ${IMAGE_TAG}"
          git push
