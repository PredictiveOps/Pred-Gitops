apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: pred
  labels:
    app: kafka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: plaintext
              containerPort: 9092
            - name: controller
              containerPort: 9093

          env:
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"

          # readinessProbe:
          #   exec:
          #     command:
          #       - /opt/kafka/bin/kafka-topics.sh
          #       - --bootstrap-server
          #       - localhost:9092
          #       - --list
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          #   timeoutSeconds: 10
          #   failureThreshold: 10

          # livenessProbe:
          #   exec:
          #     command:
          #       - /opt/kafka/bin/kafka-topics.sh
          #       - --bootstrap-server
          #       - localhost:9092
          #       - --list
          #   initialDelaySeconds: 60
          #   periodSeconds: 20
          #   timeoutSeconds: 10
          #   failureThreshold: 5

          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          # resources:
          #   requests:
          #     cpu: "500m"
          #     memory: "1Gi"
          #     ephemeral-storage: "2Gi"
          #   limits:
          #     cpu: "1"
          #     memory: "2Gi"
          #     ephemeral-storage: "4Gi"
