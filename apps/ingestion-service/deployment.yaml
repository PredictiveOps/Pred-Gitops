apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: pred
  labels:
    app: ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: asia-southeast1-docker.pkg.dev/project-79fc9abe-eb97-46c9-b31/predictive-maintenance/ingestion-service:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8081
              protocol: TCP

          env:
            # Service port
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: PORT

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ingestion-db-secret
                  key: DATABASE_URL

            # Kafka
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: KAFKA_BROKERS

            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: KAFKA_TOPIC

            # MQTT
            - name: MQTT_BROKER
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_BROKER

            - name: MQTT_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_CLIENT_ID

            - name: MQTT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_TOPIC

            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: MQTT_INGESTION_USERNAME

            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-secret
                  key: MQTT_INGESTION_PASSWORD

            - name: MQTT_CA_CERT
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_CA_CERT

            - name: MQTT_DEVICE_REGISTRATION_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_DEVICE_REGISTRATION_TOPIC

            - name: MQTT_DEVICE_REGISTRATION_RESPONSE_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: MQTT_DEVICE_REGISTRATION_RESPONSE_TOPIC

            # Redis
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: REDIS_ADDR

          volumeMounts:
            - name: mosquitto-tls
              mountPath: /mosquitto/certs
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5

          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "128Mi"
          #     ephemeral-storage: "512Mi"
          #   limits:
          #     cpu: "250m"
          #     memory: "256Mi"
          #     ephemeral-storage: "1Gi"

      volumes:
        - name: mosquitto-tls
          secret:
            secretName: mosquitto-tls-secret
