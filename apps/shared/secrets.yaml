---
# =============================================================================
# Shared Secrets — pred namespace
# All sensitive credentials referenced by deployments via envFrom or valueFrom.
#
# HOW TO ENCODE VALUES:
#   echo -n "your-value" | base64
#
# PLACEHOLDERS: Values marked with <PLACEHOLDER_...> must be replaced before
# applying. Do NOT apply this file with placeholder values in production.
# =============================================================================

# -----------------------------------------------------------------------------
# Postgres credentials
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: pred
type: Opaque
data:
  # echo -n "postgres" | base64
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: cG9zdGdyZXM=

---
# -----------------------------------------------------------------------------
# Kafka (kept as secret for consistency; swap to ConfigMap if preferred)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: pred
type: Opaque
data:
  # echo -n "kafka:9092" | base64
  KAFKA_BROKERS: a2Fma2E6OTA5Mg==
  # echo -n "device-events" | base64
  KAFKA_TOPIC: ZGV2aWNlLWV2ZW50cw==

---
# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: pred
type: Opaque
data:
  # echo -n "redis:6379" | base64
  REDIS_ADDR: cmVkaXM6NjM3OQ==

---
# -----------------------------------------------------------------------------
# Mosquitto MQTT credentials
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-secret
  namespace: pred
type: Opaque
data:
  # echo -n "pred-device" | base64
  MQTT_DEVICE_USERNAME: cHJlZC1kZXZpY2U=
  # echo -n "dev-device-password" | base64
  MQTT_DEVICE_PASSWORD: ZGV2LWRldmljZS1wYXNzd29yZA==
  # echo -n "pred-ingestion" | base64
  MQTT_INGESTION_USERNAME: cHJlZC1pbmdlc3Rpb24=
  # echo -n "dev-ingestion-password" | base64
  MQTT_INGESTION_PASSWORD: ZGV2LWluZ2VzdGlvbi1wYXNzd29yZA==

---
# -----------------------------------------------------------------------------
# Mosquitto TLS certificates
# Replace placeholder values with your actual base64-encoded cert content.
#
# To encode (Linux/Mac):
#   base64 -w 0 mosquitto/certs/ca.crt
#   base64 -w 0 mosquitto/certs/server.crt
#   base64 -w 0 mosquitto/certs/server.key
#
# On Windows (Git Bash):
#   base64 mosquitto/certs/ca.crt | tr -d '\n'
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mosquitto-tls-secret
  namespace: pred
type: Opaque
data:
  ca.crt: 
  server.crt: 
  server.key: 

---
# -----------------------------------------------------------------------------
# Keycloak admin credentials
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: pred
type: Opaque
data:
  # echo -n "admin" | base64
  KEYCLOAK_ADMIN: YWRtaW4=
  # echo -n "changeme" | base64  — CHANGE THIS in production
  KEYCLOAK_ADMIN_PASSWORD: Y2hhbmdlbWU=
  # echo -n "pred" | base64
  KEYCLOAK_REALM: cHJvZC1tYWludGVuYW5jZQ==
  # echo -n "web-frontend" | base64
  KEYCLOAK_CLIENT_ID: d2ViLWZyb250ZW5k
  # echo -n "dev-web-frontend-secret" | base64  — CHANGE THIS in production
  KEYCLOAK_CLIENT_SECRET: ZGV2LXdlYi1mcm9udGVuZC1zZWNyZXQ=
  # echo -n "Test123!" | base64
  KEYCLOAK_TEST_USER_PASSWORD: VGVzdDEyMyE=

---
# -----------------------------------------------------------------------------
# Web Frontend (NextAuth)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: web-frontend-secret
  namespace: pred
type: Opaque
data:
  # Generate: openssl rand -base64 32 | tr -d '\n' | base64
  # Then paste the result below — CHANGE THIS before deploying
  NEXTAUTH_SECRET: ZmY2NThhNzM4MTYzN2U0Y2UxMDhlNzAxM2RmZjFmMTkzYjZiZDk0YTBjYjQ5ZWY5Y2I1ZWFmYjZiNmE4MWYzMA0=
  # echo -n "dev-web-frontend-secret" | base64  — must match keycloak-secret KEYCLOAK_CLIENT_SECRET
  KEYCLOAK_CLIENT_SECRET: ZGV2LXdlYi1mcm9udGVuZC1zZWNyZXQ=

---
# -----------------------------------------------------------------------------
