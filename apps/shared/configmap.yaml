# -----------------------------------------------------------------------------
# Postgres init script config
# Runs on first startup to create all required databases.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-config
  namespace: pred
data:
  create-databases.sh: |
    #!/bin/bash
    set -e

    echo "Creating required application databases..."

    for db in $(echo "$POSTGRES_MULTIPLE_DATABASES" | tr ',' ' '); do
      echo "Checking database: $db"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 'CREATE DATABASE $db'
        WHERE NOT EXISTS (
          SELECT FROM pg_database WHERE datname = '$db'
        )\gexec
    EOSQL

      echo "Granting privileges on database: $db"

      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;
    EOSQL
    done

    echo "Postgres database initialization completed."
