apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: pred
  labels:
    app: mosquitto
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
      protocol: TCP
