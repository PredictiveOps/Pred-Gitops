apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pred
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: "ingestion-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["ingestion-service:8081"]  

      - job_name: "event-processing-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["event-processing-service:8082"]

      - job_name: "notifications-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["notifications-service:8085"]

      - job_name: "ai-ml-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["ai-ml-service:8084"]
