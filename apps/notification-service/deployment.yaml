apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: pred
  labels:
    app: notifications-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        - name: notifications-service
          image: asia-southeast1-docker.pkg.dev/project-79fc9abe-eb97-46c9-b31/predictive-maintenance/notifications-service:v1
          imagePullPolicy: IfNotPresent

          env:
            # Kafka
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: KAFKA_BROKERS

            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: NOTIFICATIONS_KAFKA_TOPIC

            - name: KAFKA_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: global-config
                  key: NOTIFICATIONS_KAFKA_GROUP_ID

            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: notifications-db-secret
                  key: DATABASE_URL

          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "128Mi"
          #     ephemeral-storage: "512Mi"
          #   limits:
          #     cpu: "250m"
          #     memory: "256Mi"
          #     ephemeral-storage: "1Gi"
