apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: pred
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
