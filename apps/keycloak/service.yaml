apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: pred
  labels:
    app: keycloak
  annotations:
    cloud.google.com/backend-config: '{"ports": {"http": "keycloak-backendconfig"}}'
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: management
      port: 9000
      targetPort: 9000
      protocol: TCP
