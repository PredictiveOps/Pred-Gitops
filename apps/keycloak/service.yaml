apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: pred
  labels:
    app: keycloak
  annotations:
    cloud.google.com/backend-config: '{"ports": {"8080": "keycloak-backendconfig"}}'
spec:
  type: ClusterIP
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
