          #   requests:
          #     cpu: "500m"
          #     memory: "1Gi"
          #     ephemeral-storage: "1Gi"
          #   limits:
          #     cpu: "1"
          #     memory: "2Gi"
          #     ephemeral-storage: "2Gi"
