apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pred-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PredictiveOps/Pred-Gitops
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: pred
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
