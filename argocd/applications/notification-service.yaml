apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service
spec:
  project: default
  source:
    repoURL: https://github.com/PredictiveOps/Pred-Gitops
    targetRevision: main
    path: apps/notification-service
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
